{% extends "base.html" %}
{% block title %}Panel - {{ app_name }}{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
{% endblock %}
{% block body %}
<div class="min-h-full flex flex-col">
  <header class="border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-lg font-semibold">{{ app_name }}</h1>
      <div class="flex items-center gap-3">
        <span class="text-sm text-gray-500 dark:text-gray-400">{{ user.username }}</span>
        <a href="/plugins/store"
           class="relative text-sm px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-900 flex items-center gap-1.5">
          <i class="fa-solid fa-store text-gray-400"></i>
          Tienda
          <span id="store-update-badge"
                class="hidden absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] leading-[18px] text-center"></span>
        </a>
        <div class="relative">
          <button id="plugins-menu-btn" type="button"
                  class="text-sm px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-900 flex items-center gap-1.5">
            Plugins
            <i class="fa-solid fa-chevron-down text-[10px] text-gray-400"></i>
          </button>
          <div id="plugins-menu"
               class="hidden absolute right-0 mt-2 w-56 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-lg py-1 z-20">
            <p class="px-3 py-2 text-sm text-gray-400">Cargando...</p>
          </div>
        </div>
        <button id="theme-toggle" type="button"
                class="p-2 rounded-lg border border-gray-200 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-900">
          <span class="dark:hidden">🌙</span>
          <span class="hidden dark:inline">☀️</span>
        </button>
        <button id="logout-btn" type="button"
                class="text-sm px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-900">
          Cerrar sesion
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
    <div id="action-feedback" class="hidden text-sm rounded-lg px-4 py-3 whitespace-pre-wrap"></div>

    <section id="system-stats" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></section>

    <section>
      <h2 class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-3">
        Instancias de emulador
      </h2>
      <div id="servers-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>
  </main>

  <div id="log-modal" class="hidden fixed inset-0 z-30 bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 w-full max-w-3xl h-[75vh] flex flex-col">
      <div class="shrink-0 flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-800">
        <h3 id="log-modal-title" class="font-medium text-sm"></h3>
        <button id="log-modal-close" type="button"
                class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="shrink-0 flex flex-wrap items-center gap-2 px-4 py-2 border-b border-gray-200 dark:border-gray-800">
        <select id="log-modal-select"
                class="text-sm rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 px-2 py-1.5 flex-1 min-w-[12rem]"></select>
        <button id="log-modal-live" type="button"
                class="text-sm px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-800">
          Ver en vivo
        </button>
        <button id="log-modal-copy" type="button"
                class="text-sm px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-800">
          Copiar
        </button>
        <a id="log-modal-download" href="#"
           class="text-sm px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-800">
          Descargar
        </a>
      </div>
      <div id="log-modal-truncated"
           class="hidden shrink-0 px-4 py-2 text-xs text-amber-800 dark:text-amber-300 bg-amber-50 dark:bg-amber-900/30 border-b border-amber-200 dark:border-amber-800"></div>
      <pre id="log-modal-content"
           class="flex-1 min-h-0 overflow-y-auto p-4 text-xs font-mono bg-gray-950 text-gray-100 whitespace-pre-wrap"></pre>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="/static/js/dashboard.js"></script>
{% endblock %}
